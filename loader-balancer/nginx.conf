
upstream proyectos-micros {
    server proyectos-micros:4001;
    server proyectos-micros-2:4001;
}

server {
    listen 80;

    # Las peticiones de clientes van al microservicio
    location /api/v1/cliente {
        proxy_pass http://microservicio-cliente:4004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Las demás peticiones van a la API principal
    location / {
        proxy_pass http://proyectos-micros;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
